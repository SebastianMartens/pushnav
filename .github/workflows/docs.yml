name: Docs build

# fork: GitHub Pages is only enabled on the upstream repo, so this fork does
# not deploy the docs site (deploy-pages failed with 404 on every push). It
# only checks that the site still builds. Upstream's docs.yml also runs
# upload-pages-artifact and a deploy job; drop those when merging upstream.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --only-group docs
      - run: uv run mkdocs build --strict
